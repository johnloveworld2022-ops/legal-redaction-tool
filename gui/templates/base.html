<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}法律卷宗脱敏工具{% endblock %}</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px 16px 80px;
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 15px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px;
  }
  .dropzone {
    border: 2px dashed #94a3b8; border-radius: 10px; padding: 40px 20px;
    text-align: center; color: var(--muted); margin-bottom: 20px;
    transition: background 0.15s, border-color 0.15s; cursor: pointer;
  }
  .dropzone.drag { background: #eff6ff; border-color: var(--blue); }
  .dropzone input[type=file] { display: none; }
  .filelist { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .filelist li { padding: 4px 0; }
  button, .btn {
    display: inline-block; background: var(--blue); color: #fff; border: none;
    padding: 13px 26px; font-size: 16px; border-radius: 8px; cursor: pointer;
    font-weight: 600; text-decoration: none;
  }
  button:hover, .btn:hover { background: var(--blue-dark); }
  button.secondary, .btn.secondary { background: #64748b; }
  button.secondary:hover, .btn.secondary:hover { background: #475569; }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  .status-clean { color: var(--green); font-weight: 700; }
  .status-review { color: var(--amber); font-weight: 700; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
  }
  .badge.clean { background: #dcfce7; color: #166534; }
  .badge.review { background: #fef3c7; color: #92400e; }
  .doc-card { border-left: 4px solid var(--amber); }
  .doc-card.clean { border-left-color: var(--green); }
  .reasons { margin: 10px 0; padding-left: 20px; color: var(--red); font-size: 14px; }
  .page-image { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; margin: 8px 0; }
  textarea {
    width: 100%; min-height: 220px; font-size: 15px; font-family: inherit;
    padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    line-height: 1.7;
  }
  .flag { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px 16px; margin: 10px 0; font-size: 14px; }
  .flag b { color: var(--red); }
  .muted { color: var(--muted); font-size: 14px; }
  .rule {
    background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px;
    padding: 14px 18px; font-size: 14px; margin-top: 24px;
  }
  a { color: var(--blue); }
  .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
  .flash.ok { background: #dcfce7; color: #166534; }
  .flash.err { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
</body>
</html>
